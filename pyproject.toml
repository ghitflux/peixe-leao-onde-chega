[project]
name = "peixe-leao"
version = "0.1.0"
description = "Onde o peixe-leão vai chegar a seguir, e quando? Velocidade da frente de invasão e modelo de espalhamento validado no tempo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jinja2>=3.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peixe_leao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
